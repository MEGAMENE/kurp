[package]
name = "kurp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "kurp"
path = "src/lib.rs"

[[bin]]
name = "kurp"
path = "src/main.rs"

[dependencies]
realcugan-ncnn-vulkan-rs = { path = "realcugan-ncnn-vulkan-rs" }

axum = "0.8"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }

log = "0.4.34"
env_logger = "0.11"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.2"
arc-swap = "1.9"

async-compression = { version = "0.4.52", features = ["tokio", "brotli", "gzip", "deflate"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
bytes = "1.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zenavif = "0.1.6"
webpx = { version = "0.4", default-features = false, features = ["encode", "icc", "std"] }
rayon = "1.10"
moka = { version = "0.12", features = ["future"] }
sync_wrapper = { version = "1.0", features = ["futures"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
