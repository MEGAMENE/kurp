[package]
name = "kurp"
version = "0.1.0"
edition = "2021"

[dependencies]
realcugan-ncnn-vulkan-rs = { path = "realcugan-ncnn-vulkan-rs" }

axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = { version = "0.3" }
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.29"

log = "0.4.26"
env_logger = "0.11"

serde = "1.0.218"
serde_derive = "1.0.218"
serde_json = "1.0.140"
serde_yaml = "0.9"

async-compression = { version = "0.4", features = ["tokio", "brotli", "gzip", "deflate"] }
config = { version = "0.15", features = ["yaml"] }
bytes = "1.10"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
headers = "0.4"
once_cell = "1.20"
moka = { version = "0.12", features = ["future"] }
ractor = "0.16.5"
regex = "1.11"
unicase = "2.8"
sync_wrapper = { version = "1.0", features = ["futures"] }