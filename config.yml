port: 3030
upstream_url: "http://localhost:8080"
allow_config_updates: false
upscale: true
size_threshold_enabled: true
size_threshold: 500
size_threshold_png: 1000
return_format: WebP

realcugan:
  gpuid: 0
  scale: 2
  noise: -1
  model: Se
  tile_size: 0
  sync_gap: 3
  tta_mode: false
  num_threads: 2
  models_path: "./models"

auto_levels:
  enabled: true
  output_grayscale_for_monochrome: true

  book_profile:
    cache_size: 100
    parallel_page_fetches: 8
    timeout_seconds: 45

  detection:
    confidence_threshold: 0.75
    black_clip_percent: 0.1
    white_clip_percent: 0.1
    surge_ratio_threshold: 2.8
    protect_sepia_artwork: true

  correction:
    max_black_shift: 30
    min_white_threshold: 200
    correct_paper_cast: true
    gamma: 1.0

  quality_guards:
    tier1:
      mse_threshold: 220.0
      psnr_min: 22.0
      check_tail_erosion: true

    tier2:
      ssim_threshold: 0.88
      chroma_delta_p95: 2.5
      chroma_delta_median: 1.5

    tier3:
      gradient_ncc: 0.90
      min_contrast_ratio: 0.50
      stride: 4
