name: Apply component chroma fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/improved-grayscale-color-pipeline

      - name: Apply component chroma criterion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/upscaler/upscaler.rs')
          s = p.read_text()

          old = '''    let mut mask = vec![false; width * height];
    for (index, pixel) in rgb.pixels().enumerate() {
        let r = pixel[0] as i16;
        let g = pixel[1] as i16;
        let b = pixel[2] as i16;
        let spread = (r - g).abs().max((r - b).abs()).max((g - b).abs());
        mask[index] = spread >= 16;
    }
    retain_significant_components(&mut mask, width, height, 8);
'''
          new = '''    let mut mask = vec![false; width * height];
    let mut strong_mask = vec![false; width * height];
    for (index, pixel) in rgb.pixels().enumerate() {
        let r = pixel[0] as i16;
        let g = pixel[1] as i16;
        let b = pixel[2] as i16;
        let spread = (r - g).abs().max((r - b).abs()).max((g - b).abs());
        mask[index] = spread >= 16;
        strong_mask[index] = spread >= 40;
    }
    retain_significant_components(&mut mask, &strong_mask, width, height, 8, 0.10);
'''
          if old not in s:
              raise SystemExit('build_color_protection_mask target not found')
          s = s.replace(old, new, 1)

          old = '''fn retain_significant_components(mask: &mut [bool], width: usize, height: usize, min_size: usize) {
'''
          new = '''fn retain_significant_components(
    mask: &mut [bool],
    strong_mask: &[bool],
    width: usize,
    height: usize,
    min_size: usize,
    min_strong_fraction: f64,
) {
'''
          if old not in s:
              raise SystemExit('retain_significant_components signature not found')
          s = s.replace(old, new, 1)

          old = '''        if component.len() < min_size {
            for index in component.iter().copied() { mask[index] = false; }
        }
'''
          new = '''        let strong_count = component.iter().filter(|&&index| strong_mask[index]).count();
        let strong_fraction = strong_count as f64 / component.len() as f64;
        if component.len() < min_size || strong_fraction < min_strong_fraction {
            for index in component.iter().copied() { mask[index] = false; }
        }
'''
          if old not in s:
              raise SystemExit('component retention block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/upscaler/upscaler.rs
          git diff --cached --check
          git commit -m "Improve grayscale color component protection"
          git push origin HEAD:fix/improved-grayscale-color-pipeline
