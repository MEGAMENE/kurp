name: Windows Release

on:
  push:
    branches:
      - fix/preserve-icc-profile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          # The Rust wrapper CMake explicitly includes the glslang CMake
          # target files. stripdown removes files we need, so keep the full SDK.
          stripdown: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Download prebuilt ncnn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'User-Agent' = 'MEGAMENE-kurp-GitHub-Actions'
            'Accept' = 'application/vnd.github+json'
          }

          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/Tencent/ncnn/releases/latest' `
            -Headers $headers

          # windows-2022 is an x64 MSVC runner. NCNN's VS2022 shared package
          # is the correct ABI and supplies ncnn.dll for the final package.
          $ncnnAsset = $release.assets |
            Where-Object { $_.name -match '^ncnn-\d+-windows-vs2022-shared\.zip$' } |
            Select-Object -First 1

          if (-not $ncnnAsset) {
            Write-Host 'Available NCNN release assets:'
            $release.assets | ForEach-Object { Write-Host " - $($_.name)" }
            throw 'Could not find the NCNN Windows VS2022 shared package.'
          }

          Write-Host "NCNN release: $($release.tag_name)"
          Write-Host "NCNN asset:   $($ncnnAsset.name)"

          $zipPath = Join-Path $env:RUNNER_TEMP 'ncnn-windows.zip'
          $ncnnPath = Join-Path $env:RUNNER_TEMP 'ncnn'

          Invoke-WebRequest `
            -Uri $ncnnAsset.browser_download_url `
            -Headers $headers `
            -OutFile $zipPath

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $ncnnPath `
            -Force

          # The package may contain multiple architecture directories. Do not
          # blindly take the first ncnnConfig.cmake: this build is x86_64.
          $configs = Get-ChildItem $ncnnPath -Recurse -Filter 'ncnnConfig.cmake'
          $ncnnConfig = $configs |
            Where-Object { $_.FullName -match '(?i)(^|[\\/])(x64|x86_64)([\\/]|$)' } |
            Select-Object -First 1

          if (-not $ncnnConfig) {
            Write-Host 'NCNN config files found:'
            $configs | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw 'Could not find an x64 ncnnConfig.cmake in the downloaded package.'
          }

          $ncnnRoot = $ncnnConfig.Directory.Parent.Parent.Parent.FullName
          $ncnnDir = $ncnnConfig.Directory.FullName

          Write-Host "NCNN_ROOT = $ncnnRoot"
          Write-Host "ncnn_DIR  = $ncnnDir"

          "NCNN_ROOT=$ncnnRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "ncnn_DIR=$ncnnDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $prefix = "$ncnnRoot;$env:CMAKE_PREFIX_PATH"
          "CMAKE_PREFIX_PATH=$prefix" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $ncnnDll = Get-ChildItem $ncnnRoot -Recurse -Filter 'ncnn.dll' |
            Select-Object -First 1

          if (-not $ncnnDll) {
            throw 'Could not find ncnn.dll in the selected x64 NCNN package.'
          }

          Write-Host "NCNN_DLL  = $($ncnnDll.FullName)"
          "NCNN_DLL=$($ncnnDll.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Vulkan and glslang paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The wrapper CMakeLists.txt expects these legacy glslang target files
          # to all be in the same directory.
          $required = @(
            'glslangTargets.cmake',
            'SPIRVTargets.cmake',
            'OSDependentTargets.cmake',
            'OGLCompilerTargets.cmake'
          )

          $candidates = Get-ChildItem "$env:VULKAN_SDK" -Recurse -Filter 'glslangTargets.cmake'
          $glslangTargets = $candidates |
            Where-Object {
              $dir = $_.Directory.FullName
              ($required | ForEach-Object { Test-Path (Join-Path $dir $_) }) -notcontains $false
            } |
            Select-Object -First 1

          if (-not $glslangTargets) {
            Write-Host 'glslangTargets.cmake candidates:'
            $candidates | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw "Could not find a complete glslang CMake target set below $env:VULKAN_SDK"
          }

          Write-Host "GLSLANG_TARGET_DIR=$($glslangTargets.Directory.FullName)"
          "GLSLANG_TARGET_DIR=$($glslangTargets.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build kurp
        shell: pwsh
        env:
          CMAKE_BUILD_TYPE: Release
        run: cargo build --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist\models -Force | Out-Null

          Copy-Item target\release\kurp.exe dist\kurp.exe
          Copy-Item $env:NCNN_DLL dist\ncnn.dll
          Copy-Item README.md, LICENSE dist\

          git clone --depth 1 https://github.com/nihui/waifu2x-ncnn-vulkan.git "$env:RUNNER_TEMP\waifu2x-models"
          git clone --depth 1 https://github.com/nihui/realcugan-ncnn-vulkan.git "$env:RUNNER_TEMP\realcugan-models"

          Copy-Item "$env:RUNNER_TEMP\waifu2x-models\models\*" dist\models\ -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\realcugan-models\models\*" dist\models\ -Recurse -Force

          Compress-Archive -Path dist\* -DestinationPath kurp-windows-x64.zip -Force
          (Get-FileHash kurp-windows-x64.zip -Algorithm SHA256).Hash | Out-File kurp-windows-x64.sha256 -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: kurp-windows-x64
          path: |
            kurp-windows-x64.zip
            kurp-windows-x64.sha256
          if-no-files-found: error

      - name: Publish Windows Latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-latest'
          $title = 'Windows Latest'
          $notes = @"
          Automated Windows x64 build from commit $env:GITHUB_SHA.

          Includes the ICC profile preservation fix and bundled Waifu2x/Real-CUGAN models.
          This is a prerelease build.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              kurp-windows-x64.zip `
              kurp-windows-x64.sha256 `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --prerelease
          }
          else {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --prerelease
            gh release upload $tag `
              kurp-windows-x64.zip `
              kurp-windows-x64.sha256 `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          }
