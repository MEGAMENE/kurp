name: Windows Release

on:
  push:
    branches:
      - fix/preserve-icc-profile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Replace NCNN Rust wrappers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $waifu2xRepo = 'https://github.com/papaj-na-wrotkach/waifu2x-ncnn-vulkan-rs.git'
          $waifu2xCommit = 'bfaae1b43c37e1f9909be0439d701f9268886b74'
          $realcuganRepo = 'https://github.com/papaj-na-wrotkach/realcugan-ncnn-vulkan-rs.git'
          $realcuganCommit = 'a034ed663c25382be4fcc47a309b0b3e4e30d5dc'

          function Replace-Wrapper($Path, $Repo, $Commit) {
            Remove-Item $Path -Recurse -Force -ErrorAction SilentlyContinue
            git clone --no-checkout --filter=blob:none $Repo $Path
            git -C $Path fetch --depth 1 origin $Commit
            git -C $Path checkout --detach $Commit
            git -C $Path submodule update --init --recursive
          }

          Replace-Wrapper 'waifu2x-ncnn-vulkan-rs' $waifu2xRepo $waifu2xCommit
          Replace-Wrapper 'realcugan-ncnn-vulkan-rs' $realcuganRepo $realcuganCommit

      - name: Install AVIF build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # rav1e enables its x86_64 assembly by default and therefore needs NASM.
          choco install nasm -y --no-progress

          # Chocolatey does not reliably refresh the current PowerShell process PATH.
          $nasmCandidates = @(
            (Get-Command nasm.exe -ErrorAction SilentlyContinue).Source,
            'C:\Program Files\NASM\nasm.exe',
            'C:\Program Files (x86)\NASM\nasm.exe'
          ) | Where-Object { $_ -and (Test-Path $_) }
          $nasmPath = $nasmCandidates | Select-Object -First 1
          if (-not $nasmPath) {
            $nasmPath = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Filter 'nasm.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $nasmPath) { throw 'NASM was installed but nasm.exe could not be located.' }
          $nasmDir = Split-Path $nasmPath -Parent
          $env:PATH = "$nasmDir;$env:PATH"
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # dav1d-sys uses pkg-config to locate the AV1 decoder. vcpkg installs
          # the release dav1d.pc under installed\x64-windows\lib\pkgconfig.
          choco install pkgconfiglite -y --no-progress
          vcpkg install dav1d:x64-windows --disable-metrics

          $pkgConfigPath = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows\lib\pkgconfig'
          $dav1dPc = Join-Path $pkgConfigPath 'dav1d.pc'
          if (-not (Test-Path $dav1dPc)) {
            throw "dav1d.pc was not found at $dav1dPc"
          }

          # dav1d-sys documents PKG_CONFIG_PATH as the supported way to point
          # system-deps at a vcpkg-installed dav1d library on Windows.
          $existingPkgConfigPath = $env:PKG_CONFIG_PATH
          if ($existingPkgConfigPath) {
            $newPkgConfigPath = "$pkgConfigPath;$existingPkgConfigPath"
          } else {
            $newPkgConfigPath = $pkgConfigPath
          }
          $env:PKG_CONFIG_PATH = $newPkgConfigPath
          "PKG_CONFIG_PATH=$newPkgConfigPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "NASM: $(nasm -v)"
          Write-Host "pkg-config: $(pkg-config --version)"
          Write-Host "PKG_CONFIG_PATH: $env:PKG_CONFIG_PATH"
          Write-Host "dav1d pkg-config: $(pkg-config --modversion dav1d)"
          Write-Host "dav1d flags: $(pkg-config --libs --cflags dav1d)"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          stripdown: false

      - name: Configure glslang CMake package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $glslangDir = Join-Path $env:RUNNER_TEMP 'glslang-cmake'
          Remove-Item $glslangDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $glslangDir -Force | Out-Null

          @'
          find_package(Vulkan REQUIRED COMPONENTS glslang)

          if (NOT TARGET Vulkan::glslang)
              message(FATAL_ERROR "CMake could not expose Vulkan::glslang from the Vulkan SDK")
          endif()

          if (NOT TARGET glslang::glslang)
              add_library(glslang::glslang INTERFACE IMPORTED)
              set_property(TARGET glslang::glslang PROPERTY INTERFACE_LINK_LIBRARIES Vulkan::glslang)
          endif()

          if (NOT TARGET glslang::SPIRV)
              add_library(glslang::SPIRV INTERFACE IMPORTED)
              set_property(TARGET glslang::SPIRV PROPERTY INTERFACE_LINK_LIBRARIES Vulkan::glslang)
          endif()
          '@ | Set-Content -Path (Join-Path $glslangDir 'glslangConfig.cmake') -Encoding utf8

          "glslang_DIR=$glslangDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Download prebuilt ncnn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            'User-Agent' = 'MEGAMENE-kurp-GitHub-Actions'
            'Accept' = 'application/vnd.github+json'
          }

          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Tencent/ncnn/releases/latest' -Headers $headers
          $ncnnAsset = $release.assets | Where-Object { $_.name -match '^ncnn-\d+-windows-vs2022-shared\.zip$' } | Select-Object -First 1

          if (-not $ncnnAsset) {
            Write-Host 'Available NCNN Windows assets:'
            $release.assets | Where-Object { $_.name -match '(?i)windows' } | ForEach-Object { Write-Host " - $($_.name)" }
            throw 'Could not find the NCNN Windows VS2022 shared package.'
          }

          $zipPath = Join-Path $env:RUNNER_TEMP 'ncnn-windows.zip'
          $ncnnPath = Join-Path $env:RUNNER_TEMP 'ncnn'
          Remove-Item $ncnnPath -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $ncnnAsset.browser_download_url -Headers $headers -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $ncnnPath -Force

          $configs = Get-ChildItem $ncnnPath -Recurse -Filter 'ncnnConfig.cmake'
          $ncnnConfig = $configs | Where-Object {
            $_.FullName -match '(?i)(^|[\\/])(x64|x86_64)([\\/]|$)' -and
            $_.FullName -notmatch '(?i)(arm64|aarch64|[\\/]arm([\\/]|$))'
          } | Select-Object -First 1

          if (-not $ncnnConfig) {
            $configs | ForEach-Object { Write-Host " - $($_.FullName)" }
            throw 'Could not find an x64 ncnnConfig.cmake in the downloaded VS2022 package.'
          }

          $ncnnRoot = $ncnnConfig.Directory.Parent.Parent.Parent.FullName
          $ncnnDir = $ncnnConfig.Directory.FullName
          "NCNN_ROOT=$ncnnRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ncnn_DIR=$ncnnDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$ncnnRoot;$env:CMAKE_PREFIX_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $ncnnLib = Get-ChildItem $ncnnRoot -Recurse -Filter 'ncnn.lib' |
            Where-Object { $_.FullName -notmatch '(?i)(arm64|aarch64|[\\/]arm([\\/]|$))' } |
            Select-Object -First 1
          if (-not $ncnnLib) { throw 'Could not find ncnn.lib in the selected x64 NCNN package.' }
          Write-Host "NCNN_LIB = $($ncnnLib.FullName)"
          "NCNN_LIB_DIR=$($ncnnLib.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$($ncnnLib.Directory.FullName);$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $ncnnDll = Get-ChildItem $ncnnRoot -Recurse -Filter 'ncnn.dll' |
            Where-Object { $_.FullName -notmatch '(?i)(arm64|aarch64|[\\/]arm([\\/]|$))' } |
            Select-Object -First 1
          if (-not $ncnnDll) { throw 'Could not find ncnn.dll in the selected x64 NCNN package.' }
          "NCNN_DLL=$($ncnnDll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build kurp
        shell: pwsh
        env:
          CMAKE_BUILD_TYPE: Release
        run: cargo build --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist\models -Force | Out-Null
          Copy-Item target\release\kurp.exe dist\kurp.exe
          Copy-Item $env:NCNN_DLL dist\ncnn.dll
          Copy-Item README.md, LICENSE dist\
          git clone --depth 1 https://github.com/nihui/waifu2x-ncnn-vulkan.git "$env:RUNNER_TEMP\waifu2x-models"
          git clone --depth 1 https://github.com/nihui/realcugan-ncnn-vulkan.git "$env:RUNNER_TEMP\realcugan-models"
          Copy-Item "$env:RUNNER_TEMP\waifu2x-models\models\*" dist\models\ -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\realcugan-models\models\*" dist\models\ -Recurse -Force
          Compress-Archive -Path dist\* -DestinationPath kurp-windows-x64.zip -Force
          (Get-FileHash kurp-windows-x64.zip -Algorithm SHA256).Hash | Out-File kurp-windows-x64.sha256 -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: kurp-windows-x64
          path: |
            kurp-windows-x64.zip
            kurp-windows-x64.sha256
          if-no-files-found: error

      - name: Publish Windows Latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-latest'
          $title = 'Windows Latest'
          $notes = @"
          Automated Windows x64 build from commit $env:GITHUB_SHA.

          Includes the ICC profile preservation fix and bundled Waifu2x/Real-CUGAN models.
          This is a prerelease build.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag kurp-windows-x64.zip kurp-windows-x64.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
            gh release upload $tag kurp-windows-x64.zip kurp-windows-x64.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          }