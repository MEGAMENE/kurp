name: Build and Release Windows x64

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          version: 1.3.268.0
          cache: true

      - name: Set up ncnn
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tencent/ncnn/releases/download/20240102/ncnn-20240102-windows-vs2022-shared.zip" -OutFile "ncnn.zip"
          Expand-Archive -Path "ncnn.zip" -DestinationPath "ncnn"
          $ncnnDir = (Resolve-Path "ncnn/ncnn-20240102-windows-vs2022-shared/x64").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ncnn_DIR=$ncnnDir/lib/cmake/ncnn"
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-L native=$ncnnDir/lib"
          Add-Content -Path $env:GITHUB_PATH -Value "$ncnnDir/bin"

      - name: Download RealCUGAN models
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/nihui/realcugan-ncnn-vulkan/archive/refs/heads/master.zip" -OutFile "realcugan-repo.zip"
          Expand-Archive -Path "realcugan-repo.zip" -DestinationPath "realcugan-repo"
          New-Item -ItemType Directory -Force -Path "models"
          Copy-Item -Path "realcugan-repo/realcugan-ncnn-vulkan-master/models/*" -Destination "models" -Recurse -Force

      - name: Build Kurp (Release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows x64 Release
        shell: pwsh
        run: |
          $packageDir = "kurp-windows-x64"
          New-Item -ItemType Directory -Force -Path $packageDir
          Copy-Item -Path "target/x86_64-pc-windows-msvc/release/kurp.exe" -Destination "$packageDir/"
          $ncnnDir = (Resolve-Path "ncnn/ncnn-20240102-windows-vs2022-shared/x64").Path
          Copy-Item -Path "$ncnnDir/bin/ncnn.dll" -Destination "$packageDir/"
          Copy-Item -Path "models" -Destination "$packageDir/models" -Recurse -Force
          Copy-Item -Path "README.md" -Destination "$packageDir/"
          Copy-Item -Path "LICENSE" -Destination "$packageDir/"
          
          @'
          port: 3030
          upstream_url: "http://localhost:8080"
          allow_config_updates: false
          upscale: true
          size_threshold_enabled: true
          size_threshold: 500
          size_threshold_png: 1000
          return_format: WebP

          realcugan:
            gpuid: 0
            scale: 2
            noise: -1
            model: Se
            tile_size: 0
            sync_gap: 3
            tta_mode: false
            num_threads: 2
            models_path: "./models"
          '@ | Set-Content -Path "$packageDir/config.yml" -Encoding utf8

          Compress-Archive -Path "$packageDir/*" -DestinationPath "kurp-windows-x64.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.sha }}
          name: "Kurp Windows x64 (${{ github.sha }})"
          body: |
            Automated Windows x64 build for commit `${{ github.sha }}` on branch `development`.
            
            ### Included in `kurp-windows-x64.zip`:
            - `kurp.exe` (Windows x64 executable)
            - `ncnn.dll` (Vulkan runtime)
            - `models/` (Real-CUGAN models)
            - `config.yml` (Default configuration)
          draft: false
          prerelease: true
          files: kurp-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
